# Gun Detection Pipeline Configuration Settings

stream:
  default_source: "sim"             # Options: "sim" (Simulation Test Harness), "0" (Webcam), "rtsp" (Uses rtsp_url below), or custom RTSP URL / video path
  rtsp_url: "rtsp://<user>:<password>@<camera-ip>/Streaming/Channels/101"
  async_capture: true               # Multi-threaded bufferless capture for zero lag and zero quality drop
  location_risk: 0.0                # Baseline location threat level: 0.0 (low risk, e.g. gun range) to 1.0 (high risk, e.g. school lobby)

detector:
  gun_model: "best_gun_26n(23).pt"       # Firearm YOLO model weights file
  primary_conf_threshold: 0.25      # Highly responsive threshold for fast motion & moving weapons
  secondary_conf_threshold: 0.25    # Secondary detector confidence threshold
  person_conf_threshold: 0.25       # Person detection confidence threshold (yolo11m.pt)
  watch_state_tolerance: 0.15       # Threshold difference triggering "Watch State"
  require_person: false             # Set to true to detect guns ONLY when held by a person. Set to false to detect guns anywhere (unattended on tables/walls or in rooms without people).
  device: "auto"                    # Inference device: 'auto' (GPU if available, else CPU), 'cuda', 'cpu', '0'

vector_verify:
  similarity_threshold: 0.70        # Vector similarity cutoff for firearm crops
  hard_negative_threshold: 0.60     # Hard negative penalty threshold (phones, bottles, tools)

temporal:
  history_frames: 4                 # Shorter window for fast reaction
  min_detections_in_window: 2       # Responsive trigger: detects after 2 positive frames
  danger_duration_seconds: 3.0      # Continuous gun exposure duration to escalate to DANGER

risk:
  high_threshold: 0.75              # Threat score cutoff for HIGH / DANGER alert
  medium_threshold: 0.45            # Threat score cutoff for SUSPECT state
